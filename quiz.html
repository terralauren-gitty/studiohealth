<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find Your Treatment | StudioHealth Vancouver</title>
  <meta name="description" content="Answer 6 quick questions to find out which StudioHealth treatments — chiropractic, RMT, acupuncture, or SoftWave — are most likely to help your specific condition.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --forest: #1a2e1e;
      --sage: #4a7c59;
      --mint: #a8c5a0;
      --cream: #f5f0e8;
      --warm-white: #faf8f4;
      --charcoal: #2c2c2c;
      --stone: #8a8578;
      --gold: #c9a84c;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--forest);
      color: var(--charcoal);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── BG TEXTURE ── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 15% 20%, rgba(74,124,89,0.25) 0%, transparent 55%),
        radial-gradient(ellipse at 85% 75%, rgba(201,168,76,0.1) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* ── NAV BAR ── */
    .quiz-nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2.5rem;
      height: 64px;
      background: rgba(26,46,30,0.85);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(168,197,160,0.12);
    }
    .quiz-nav-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: white;
      text-decoration: none;
    }
    .quiz-nav-logo span { color: var(--mint); }
    .quiz-nav-back {
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      text-decoration: none;
      transition: color 0.2s;
    }
    .quiz-nav-back:hover { color: var(--mint); }

    /* ── MAIN WRAPPER ── */
    .quiz-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 4rem;
    }

    /* ── PROGRESS BAR ── */
    .progress-track {
      position: fixed;
      top: 64px;
      left: 0;
      right: 0;
      height: 3px;
      background: rgba(255,255,255,0.08);
      z-index: 49;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--mint), var(--gold));
      transition: width 0.5s cubic-bezier(0.4,0,0.2,1);
    }

    /* ── STEP COUNTER ── */
    .step-counter {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mint);
      margin-bottom: 1rem;
      text-align: center;
    }

    /* ── CARD ── */
    .quiz-card {
      background: rgba(250,248,244,0.97);
      border-radius: 24px;
      width: 100%;
      max-width: 680px;
      padding: 3rem 3.5rem;
      box-shadow: 0 40px 100px rgba(0,0,0,0.35), 0 0 0 1px rgba(255,255,255,0.05);
      animation: cardIn 0.45s cubic-bezier(0.34,1.56,0.64,1) both;
    }
    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    .card-exit {
      animation: cardOut 0.25s ease forwards;
    }
    @keyframes cardOut {
      to { opacity: 0; transform: translateY(-16px) scale(0.98); }
    }

    /* ── QUESTION ── */
    .q-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 0.6rem;
    }
    .q-text {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(1.7rem, 3vw, 2.3rem);
      font-weight: 400;
      color: var(--forest);
      line-height: 1.25;
      margin-bottom: 0.6rem;
    }
    .q-sub {
      font-size: 0.83rem;
      color: var(--stone);
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    /* ── OPTIONS ── */
    .options {
      display: grid;
      gap: 0.75rem;
    }
    .options.two-col { grid-template-columns: 1fr 1fr; }

    .opt {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.3rem;
      background: var(--warm-white);
      border: 2px solid rgba(74,124,89,0.12);
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.18s ease;
      user-select: none;
    }
    .opt:hover {
      border-color: var(--sage);
      background: rgba(74,124,89,0.04);
      transform: translateX(3px);
    }
    .opt.selected {
      border-color: var(--sage);
      background: rgba(74,124,89,0.08);
    }
    .opt-icon {
      font-size: 1.5rem;
      flex-shrink: 0;
      width: 36px;
      text-align: center;
    }
    .opt-text { flex: 1; }
    .opt-label {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--forest);
      display: block;
    }
    .opt-hint {
      font-size: 0.75rem;
      color: var(--stone);
      display: block;
      margin-top: 0.15rem;
      line-height: 1.4;
    }
    .opt-check {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(74,124,89,0.25);
      border-radius: 50%;
      flex-shrink: 0;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .opt.selected .opt-check {
      background: var(--sage);
      border-color: var(--sage);
    }
    .opt.selected .opt-check::after {
      content: '✓';
      color: white;
      font-size: 0.65rem;
      font-weight: 700;
    }

    /* multi-select helper */
    .q-multi-hint {
      font-size: 0.72rem;
      color: var(--stone);
      font-style: italic;
      margin-bottom: 1rem;
    }

    /* ── NAVIGATION BUTTONS ── */
    .quiz-nav-btns {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 2rem;
      gap: 1rem;
    }
    .btn-back {
      background: none;
      border: 2px solid rgba(74,124,89,0.2);
      color: var(--stone);
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-back:hover { border-color: var(--sage); color: var(--sage); }
    .btn-back:disabled { opacity: 0.3; cursor: default; }

    .btn-next {
      background: var(--forest);
      color: white;
      border: none;
      padding: 0.85rem 2rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-next:hover { background: var(--sage); }
    .btn-next:disabled { opacity: 0.35; cursor: default; }
    .btn-next .arrow { transition: transform 0.2s; }
    .btn-next:not(:disabled):hover .arrow { transform: translateX(4px); }

    /* ── RESULTS ── */
    .results-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .results-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(74,124,89,0.1);
      border: 1px solid rgba(74,124,89,0.25);
      border-radius: 100px;
      padding: 0.35rem 1rem;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--sage);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .results-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2.2rem;
      font-weight: 400;
      color: var(--forest);
      line-height: 1.2;
      margin-bottom: 0.5rem;
    }
    .results-title em { font-style: italic; color: var(--sage); }
    .results-sub { font-size: 0.85rem; color: var(--stone); line-height: 1.65; }

    .recs { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }

    .rec-card {
      border-radius: 14px;
      border: 2px solid transparent;
      overflow: hidden;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .rec-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(26,46,30,0.1); }

    .rec-card.primary {
      border-color: var(--sage);
      background: white;
    }
    .rec-card.secondary {
      border-color: rgba(74,124,89,0.2);
      background: var(--warm-white);
    }

    .rec-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem 0.8rem;
    }
    .rec-icon { font-size: 1.8rem; flex-shrink: 0; }
    .rec-meta { flex: 1; }
    .rec-rank {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sage);
      margin-bottom: 0.15rem;
    }
    .rec-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.35rem;
      font-weight: 600;
      color: var(--forest);
    }

    .match-bar-wrap {
      padding: 0 1.5rem 0.4rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .match-bar-track {
      flex: 1;
      height: 6px;
      background: rgba(74,124,89,0.12);
      border-radius: 100px;
      overflow: hidden;
    }
    .match-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--sage), var(--mint));
      border-radius: 100px;
      transition: width 1s cubic-bezier(0.4,0,0.2,1) 0.3s;
    }
    .match-pct {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--sage);
      white-space: nowrap;
    }

    .rec-why {
      padding: 0 1.5rem 0.8rem;
      font-size: 0.83rem;
      color: var(--stone);
      line-height: 1.7;
    }
    .rec-why strong { color: var(--forest); }

    .rec-conditions {
      padding: 0.6rem 1.5rem 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      border-top: 1px solid rgba(74,124,89,0.1);
    }
    .cond-tag {
      background: rgba(74,124,89,0.07);
      color: var(--sage);
      border-radius: 100px;
      padding: 0.2rem 0.65rem;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    /* CTA section */
    .results-cta {
      background: var(--forest);
      border-radius: 14px;
      padding: 2rem;
      text-align: center;
      color: white;
    }
    .results-cta p {
      font-size: 0.85rem;
      color: rgba(255,255,255,0.65);
      margin-bottom: 1.2rem;
      line-height: 1.6;
    }
    .cta-btns { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn-book {
      background: var(--sage);
      color: white;
      padding: 0.8rem 1.8rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: background 0.2s;
      border: none;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-book:hover { background: #3d6b4f; }
    .btn-retake {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.7);
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.15);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'DM Sans', sans-serif;
    }
    .btn-retake:hover { background: rgba(255,255,255,0.14); color: white; }

    /* disclaimer */
    .disclaimer {
      font-size: 0.7rem;
      color: rgba(255,255,255,0.35);
      margin-top: 1rem;
      line-height: 1.6;
    }

    /* ── INTRO SCREEN ── */
    .intro-card {
      text-align: center;
      max-width: 600px;
    }
    .intro-icon { font-size: 3.5rem; margin-bottom: 1.5rem; }
    .intro-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 300;
      color: var(--forest);
      line-height: 1.15;
      margin-bottom: 1rem;
    }
    .intro-title em { font-style: italic; color: var(--sage); }
    .intro-body {
      font-size: 0.9rem;
      color: var(--stone);
      line-height: 1.75;
      margin-bottom: 2rem;
    }
    .intro-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      justify-content: center;
      margin-bottom: 2.5rem;
    }
    .intro-pill {
      background: rgba(74,124,89,0.08);
      border: 1px solid rgba(74,124,89,0.2);
      border-radius: 100px;
      padding: 0.4rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--sage);
      letter-spacing: 0.04em;
    }
    .btn-start {
      background: var(--forest);
      color: white;
      border: none;
      padding: 1rem 2.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.25s;
      font-family: 'DM Sans', sans-serif;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-start:hover { background: var(--sage); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(26,46,30,0.25); }
    .intro-meta { font-size: 0.72rem; color: var(--stone); margin-top: 0.8rem; }

    @media (max-width: 640px) {
      .quiz-card { padding: 2rem 1.5rem; }
      .options.two-col { grid-template-columns: 1fr; }
      .cta-btns { flex-direction: column; }
    }
  </style>
</head>
<body>

<nav class="quiz-nav">

  <a href="index.html" class="quiz-nav-back">← Back to site</a>
</nav>

<div class="progress-track">
  <div class="progress-fill" id="progressFill" style="width:0%"></div>
</div>

<div class="quiz-shell">
  <div id="stepCounter" class="step-counter" style="color:rgba(255,255,255,0.5)"></div>
  <div id="quizCard" class="quiz-card"></div>
</div>

    id: 'q6',

// ─── STATE ────────────────────────────────────────────────────
let currentStep = -1; // -1 = intro
const answers = {};
const totalSteps = questions.length;

// ─── RENDER ───────────────────────────────────────────────────
function render() {
  const card = document.getElementById('quizCard');
  const counter = document.getElementById('stepCounter');
  const progress = document.getElementById('progressFill');

  if (currentStep === -1) {
    counter.textContent = '';
    progress.style.width = '0%';
    card.innerHTML = renderIntro();
    return;
  }

  if (currentStep >= totalSteps) {
    counter.textContent = 'Your Results';
    progress.style.width = '100%';
    card.innerHTML = renderResults();
    animateMatchBars();
    return;
  }

  const q = questions[currentStep];
  const pct = ((currentStep) / totalSteps * 100);
  progress.style.width = pct + '%';
  counter.textContent = q.label;

  const sel = answers[q.id] || [];

  card.innerHTML = `
    <div class="q-label">${q.label}</div>
    <div class="q-text">${q.text}</div>
    ${q.sub ? `<div class="q-sub">${q.sub}</div>` : ''}
    ${q.multi ? `<div class="q-multi-hint">Select up to ${q.maxSelect}</div>` : ''}
    <div class="options ${q.options.length <= 4 ? '' : 'two-col'}" id="options">
      ${q.options.map(o => `
        <div class="opt ${sel.includes(o.id) ? 'selected' : ''}" data-id="${o.id}" onclick="selectOpt('${q.id}','${o.id}',${q.multi},${q.maxSelect||1})">
          <div class="opt-icon">${o.icon}</div>
          <div class="opt-text">
            <span class="opt-label">${o.label}</span>
            ${o.hint ? `<span class="opt-hint">${o.hint}</span>` : ''}
          </div>
          <div class="opt-check"></div>
        </div>
      `).join('')}
    </div>
    <div class="quiz-nav-btns">
      <button class="btn-back" onclick="goBack()" ${currentStep === 0 ? 'disabled' : ''}>← Back</button>
      <button class="btn-next" id="btnNext" onclick="goNext()" ${sel.length === 0 ? 'disabled' : ''}>
        ${currentStep === totalSteps - 1 ? 'See My Results' : 'Next'}
        <span class="arrow">→</span>
      </button>
    </div>
  `;
}

function renderIntro() {
  return `
    <div class="intro-card" style="margin:0 auto; text-align:center">
      <div class="intro-icon">🩺</div>
      <h1 class="intro-title">Find your <em>ideal</em><br>treatment</h1>
      <p class="intro-body">
        Answer 6 quick questions and we'll recommend the StudioHealth treatments most likely to help your specific situation — and explain exactly why.
      </p>
      <div class="intro-pills">
        <span class="intro-pill">🦴 Chiropractic</span>
        <span class="intro-pill">🙌 Massage Therapy</span>
        <span class="intro-pill">🪡 Acupuncture</span>
        <span class="intro-pill">⚡ SoftWave</span>
      </div>
      <button class="btn-start" onclick="startQuiz()">
        Start Assessment <span>→</span>
      </button>
      <div class="intro-meta">Takes about 2 minutes · No sign-up required</div>
    </div>
  `;
}

function renderResults() {
  const scores = { chiro: 0, rmt: 0, acu: 0, softwave: 0 };

  questions.forEach(q => {
    const sel = answers[q.id] || [];
    sel.forEach(id => {
      const opt = q.options.find(o => o.id === id);
      if (opt) {
        Object.keys(scores).forEach(k => { scores[k] += (opt.scores[k] || 0); });
      }
    });
  });

  const maxScore = Math.max(...Object.values(scores));
  const ranked = Object.entries(scores)
    .map(([k,v]) => ({ key: k, score: v, pct: Math.round((v / maxScore) * 100) }))
    .sort((a,b) => b.score - a.score);

  const primary = ranked[0];
  const secondary = ranked.slice(1,3).filter(r => r.pct >= 40);

  const renderRec = (r, rank) => {
    const t = treatments[r.key];
    const isPrimary = rank === 0;
    return `
      <div class="rec-card ${isPrimary ? 'primary' : 'secondary'}">
        <div class="rec-header">
          <div class="rec-icon">${t.icon}</div>
          <div class="rec-meta">
            <div class="rec-rank">${isPrimary ? '★ Top Recommendation' : '✓ Also Recommended'}</div>
            <div class="rec-name">${t.name}</div>
          </div>
        </div>
        <div class="match-bar-wrap">
          <div class="match-bar-track">
            <div class="match-bar-fill" data-width="${r.pct}" style="width:0%"></div>
          </div>
          <div class="match-pct">${r.pct}% match</div>
        </div>
        <div class="rec-why">${t.whyTemplate(answers)}</div>
        <div class="rec-conditions">
          ${t.conditions.map(c => `<span class="cond-tag">${c}</span>`).join('')}
        </div>
      </div>
    `;
  };

  const primaryT = treatments[primary.key];

  return `
    <div class="results-header">
      <div class="results-badge">✓ Assessment Complete</div>
      <div class="results-title">Here's what we <em>recommend</em></div>
      <p class="results-sub">Based on your answers, these treatments are the strongest fit for your situation.</p>
    </div>
    <div class="recs">
      ${renderRec(primary, 0)}
      ${secondary.map((r,i) => renderRec(r, i+1)).join('')}
    </div>
    <div class="results-cta">
      <p>These are personalized recommendations, not a diagnosis. Our practitioners will confirm the right approach at your first visit — which is always a thorough one-on-one assessment.</p>
      <div class="cta-btns">
        <a href="${primaryT.bookUrl}" target="_blank" class="btn-book">Book ${primaryT.name} →</a>
        <a href="https://studiohealth.janeapp.com/" target="_blank" class="btn-book" style="background:rgba(255,255,255,0.12); color:white;">See All Availability</a>
        <button class="btn-retake" onclick="retake()">Retake Quiz</button>
      </div>
      <div class="disclaimer">This tool is for informational purposes only and does not constitute medical advice. Always consult a qualified healthcare practitioner for diagnosis and treatment.</div>
    </div>
  `;
}

// ─── HELPERS ──────────────────────────────────────────────────
function animateMatchBars() {
  setTimeout(() => {
    document.querySelectorAll('.match-bar-fill').forEach(el => {
      el.style.width = el.dataset.width + '%';
    });
  }, 100);
}

function selectOpt(qId, optId, multi, maxSelect) {
  const sel = answers[qId] || [];
  if (multi) {
    const idx = sel.indexOf(optId);
    if (idx > -1) {
      answers[qId] = sel.filter(id => id !== optId);
    } else if (sel.length < maxSelect) {
      answers[qId] = [...sel, optId];
    }
  } else {
    answers[qId] = [optId];
  }
  render();
}

function goNext() {
  const card = document.getElementById('quizCard');
  card.classList.add('card-exit');
  setTimeout(() => {
    card.classList.remove('card-exit');
    currentStep++;
    render();
  }, 220);
}

function goBack() {
  if (currentStep <= 0) { currentStep = -1; }
  else { currentStep--; }
  render();
}

function startQuiz() {
  currentStep = 0;
  render();
}

function retake() {
  Object.keys(answers).forEach(k => delete answers[k]);
  currentStep = -1;
  render();
}

// ─── INIT ─────────────────────────────────────────────────────
render();
</script>
